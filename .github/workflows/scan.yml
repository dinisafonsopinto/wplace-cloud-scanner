name: Wplace Background Scanner

on:
  schedule:
    # Runs at minute 0 every 2 hours UTC
    - cron: '0 */2 * * *'

  workflow_dispatch:
    inputs:
      start_x:
        description: 'Start X (Blank = use saved Target)'
        required: false
        type: string
      start_y:
        description: 'Start Y (Blank = use saved Target)'
        required: false
        type: string
      end_x:
        description: 'End X (Blank = use saved Target)'
        required: false
        type: string
      end_y:
        description: 'End Y (Blank = use saved Target)'
        required: false
        type: string
      run_duration_mins:
        description: 'Run duration mins (Default: 25)'
        required: false
        default: '100'
        type: string
      target_interval:
        description: 'Target Interval ms (Default: 500)'
        required: false
        default: '500'
        type: string
      min_floor:
        description: 'Min Floor ms (Default: 399)'
        required: false
        default: '399'
        type: string
      pause_sec_429:
        description: '429 Pause sec (Default: 321)'
        required: false
        default: '321'
        type: string
      penalty_ms_429:
        description: '429 Penalty +ms (Default: 500)'
        required: false
        default: '500'
        type: string
      step_down_ms:
        description: 'Speed Step -ms (Default: 21)'
        required: false
        default: '21'
        type: string
      streak_reqs:
        description: 'Streak for Step (Default: 42)'
        required: false
        default: '42'
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Execute Scanner
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          START_X: ${{ inputs.start_x != '' && inputs.start_x || vars.TARGET_START_X }}
          START_Y: ${{ inputs.start_y != '' && inputs.start_y || vars.TARGET_START_Y }}
          END_X: ${{ inputs.end_x != '' && inputs.end_x || vars.TARGET_END_X }}
          END_Y: ${{ inputs.end_y != '' && inputs.end_y || vars.TARGET_END_Y }}
          RUN_DURATION_MINS: ${{ inputs.run_duration_mins != '' && inputs.run_duration_mins || '25' }}
          PAUSE_INTERVAL_MINS: '0'
          TOTAL_CYCLES: '1'
          TARGET_INTERVAL: ${{ inputs.target_interval != '' && inputs.target_interval || '500' }}
          MIN_FLOOR: ${{ inputs.min_floor != '' && inputs.min_floor || '399' }}
          PAUSE_SEC_429: ${{ inputs.pause_sec_429 != '' && inputs.pause_sec_429 || '321' }}
          PENALTY_MS_429: ${{ inputs.penalty_ms_429 != '' && inputs.penalty_ms_429 || '500' }}
          STEP_DOWN_MS: ${{ inputs.step_down_ms != '' && inputs.step_down_ms || '21' }}
          STREAK_REQS: ${{ inputs.streak_reqs != '' && inputs.streak_reqs || '42' }}
        run: node bot.js