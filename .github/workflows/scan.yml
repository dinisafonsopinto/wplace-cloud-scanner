name: Wplace Background Scanner

on:
  schedule:
    - cron: '49 */6 * * *'

  workflow_dispatch:
    inputs:
      start_x:
        description: 'Start X (Blank = use saved Target)'
        required: false
        type: string
      start_y:
        description: 'Start Y (Blank = use saved Target)'
        required: false
        type: string
      end_x:
        description: 'End X (Blank = use saved Target)'
        required: false
        type: string
      end_y:
        description: 'End Y (Blank = use saved Target)'
        required: false
        type: string
      horizontal_divisions:
        description: 'Column Amount'
        required: true
        default: '2'
        type: string
      vertical_divisions: 
        description: 'Row Amount'
        required: true
        default: '2'
        type: string
      stagger_interval_secs:
        description: 'Stagger delay between each bot starting (s)'
        required: false
        default: '0'
        type: string
      run_duration_mins:
        description: 'Run duration mins'
        required: false
        type: string
      target_interval:
        description: 'Target Interval (ms)'
        required: false
        type: string
      min_floor:
        description: 'Min Floor (ms)'
        required: false
        type: string
      pause_sec_429:
        description: '429 Pause (s)'
        required: false
        type: string
      penalty_ms_429:
        description: '429 Penalty (+ms)'
        required: false
        type: string
      step_down_ms:
        description: 'Speed Step (-ms)'
        required: false
        type: string
      streak_reqs:
        description: 'Streak for Step'
        required: false
        type: string
      total_cycles:
        description: 'Amount of Cycles'
        required: false
        type: string
      pause_interval_secs:
        description: 'Pause between Cycles (s)'
        required: false
        type: string
      flush_minimum:
        description: 'Flush Minimum (px/min)'
        required: false
        type: string
      expansion_algorithm:
        description: 'Use expansion algortihm?'
        required: true
        type: boolean
      limit_expansion:
        description: 'Limit expansion to affected tiles?'
        required: true
        type: boolean
      expansion_rate:
        description: 'If there are too many queue pixels, how often do you want to expand during the normal scan? (0 for none, 1 for always, otherwise every n pixels)'
        required: false
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
      global_start_x: ${{ steps.generate-matrix.outputs.global_start_x }}
      global_start_y: ${{ steps.generate-matrix.outputs.global_start_y }}
      global_end_x: ${{ steps.generate-matrix.outputs.global_end_x }}
      global_end_y: ${{ steps.generate-matrix.outputs.global_end_y }}
    steps:
      - name: Calculate Grid Coordinates
        id: generate-matrix
        env:
          INPUT_START_X: ${{ inputs.start_x }}
          INPUT_START_Y: ${{ inputs.start_y }}
          INPUT_END_X: ${{ inputs.end_x }}
          INPUT_END_Y: ${{ inputs.end_y }}
          TARGET_ZONES: ${{ vars.TARGET_ZONES }}
          RUN_NUMBER: ${{ github.run_number }}
          HORIZONTAL_DIVISIONS: ${{ inputs.horizontal_divisions || vars.HORIZONTAL_DIVISIONS || '2' }}
          VERTICAL_DIVISIONS: ${{ inputs.vertical_divisions || vars.VERTICAL_DIVISIONS || '2' }}
        run: |
          node -e '
            let startX = parseInt(process.env.INPUT_START_X, 10);
            let startY = parseInt(process.env.INPUT_START_Y, 10);
            let endX = parseInt(process.env.INPUT_END_X, 10);
            let endY = parseInt(process.env.INPUT_END_Y, 10);

            // If manual inputs are empty (e.g., a scheduled run), pick a random zone from vars.TARGET_ZONES
            if (isNaN(startX) || isNaN(startY) || isNaN(endX) || isNaN(endY)) {
              try {
                const zones = JSON.parse(process.env.TARGET_ZONES);
                const runNumber = parseInt(process.env.RUN_NUMBER, 10);
                const selectedZone = zones[runNumber % zones.length];
                
                startX = selectedZone.sx;
                startY = selectedZone.sy;
                endX = selectedZone.ex;
                endY = selectedZone.ey;
                
                console.log(`Scheduled run detected. Selected zone from vars: [${startX}, ${startY}] to [${endX}, ${endY}]`);
              } catch (e) {
                console.error("Error parsing TARGET_ZONES. Ensure it is a valid JSON array.");
                process.exit(1);
              }
            }

            const horizontal_divisions = parseInt(process.env.HORIZONTAL_DIVISIONS, 10);
            const vertical_divisions = parseInt(process.env.VERTICAL_DIVISIONS, 10);

            const width = Math.floor((endX - startX + 1) / horizontal_divisions);
            const height = Math.floor((endY - startY + 1) / vertical_divisions);
            const matrix = { include: [] };
            
            let jobIndex = 0; // Initialize a counter for the jobs

            for(let i=0; i<horizontal_divisions; i++) {
              for(let j=0; j<vertical_divisions; j++) {
                const sx = startX + (i * width);
                const sy = startY + (j * height);
                const ex = (i === horizontal_divisions - 1) ? endX : sx + width - 1;
                const ey = (j === vertical_divisions - 1) ? endY : sy + height - 1;
                
                matrix.include.push({
                  start_x: sx.toString(),
                  start_y: sy.toString(),
                  end_x: ex.toString(),
                  end_y: ey.toString(),
                  zone: `Sector ${i}-${j}`,
                  index: jobIndex.toString() // Add the index to the matrix output
                });
                jobIndex++;
              }
            }

            console.log(`matrix=${JSON.stringify(matrix)}`);
            console.log(`global_start_x=${startX}`);
            console.log(`global_start_y=${startY}`);
            console.log(`global_end_x=${endX}`);
            console.log(`global_end_y=${endY}`);
          ' >> "$GITHUB_OUTPUT"

  scan:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Prevents one failing bot from canceling all other bots
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    
    name: Scan ${{ matrix.zone }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Staggered Start Delay
        env:
          STAGGER_INTERVAL: ${{ inputs.stagger_interval_secs != '' && inputs.stagger_interval_secs || vars.STAGGER_INTERVAL_SECS || '0' }}
        run: |
          # Multiply the interval by the job's unique index
          DELAY=$(( ${{ matrix.index }} * STAGGER_INTERVAL ))
          if [ "$DELAY" -gt "0" ]; then
            echo "Staggering start: Sleeping for $DELAY seconds before executing bot..."
            sleep $DELAY
          else
            echo "No stagger delay required for this job."
          fi

      - name: Execute Scanner
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SYNC_SECRET_KEY: ${{ secrets.SYNC_SECRET_KEY }}

          START_X: ${{ matrix.start_x }}
          START_Y: ${{ matrix.start_y }}
          END_X: ${{ matrix.end_x }}
          END_Y: ${{ matrix.end_y }}

          GLOBAL_MIN_X: ${{ needs.setup.outputs.global_start_x }}
          GLOBAL_MAX_X: ${{ needs.setup.outputs.global_end_x }}
          GLOBAL_MIN_Y: ${{ needs.setup.outputs.global_start_y }}
          GLOBAL_MAX_Y: ${{ needs.setup.outputs.global_end_y }}

          EXPANSION_ALGORITHM: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.expansion_algorithm) || vars.EXPANSION_ALGORITHM }}
          LIMIT_EXPANSION: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.limit_expansion) || vars.LIMIT_EXPANSION }}

          RUN_DURATION_MINS: ${{ inputs.run_duration_mins != '' && inputs.run_duration_mins || vars.RUN_DURATION_MINS || '67'}}
          PAUSE_INTERVAL_SECS: ${{ inputs.pause_interval_secs != '' && inputs.pause_interval_secs || vars.PAUSE_INTERVAL_SECS || '3' }}
          TOTAL_CYCLES: ${{ inputs.total_cycles != '' && inputs.total_cycles || vars.TOTAL_CYCLES || '1' }}
          FLUSH_MINIMUM: ${{ inputs.flush_minimum != '' && inputs.flush_minimum || vars.FLUSH_MINIMUM || '1' }}
          TARGET_INTERVAL: ${{ inputs.target_interval != '' && inputs.target_interval || vars.TARGET_INTERVAL || '500' }}
          MIN_FLOOR: ${{ inputs.min_floor != '' && inputs.min_floor || vars.MIN_FLOOR || '399' }}
          PAUSE_SEC_429: ${{ inputs.pause_sec_429 != '' && inputs.pause_sec_429 || vars.PAUSE_SEC_429 || '321' }}
          PENALTY_MS_429: ${{ inputs.penalty_ms_429 != '' && inputs.penalty_ms_429 || vars.PENALTY_MS_429 || '500' }}
          STEP_DOWN_MS: ${{ inputs.step_down_ms != '' && inputs.step_down_ms || vars.STEP_DOWN_MS || '21' }}
          STREAK_REQS: ${{ inputs.streak_reqs != '' && inputs.streak_reqs || vars.STREAK_REQS || '42' }}
          FLUSH_INTERVAL: ${{ vars.FLUSH_INTERVAL || '1000' }}
          EXPANSION_RATE: ${{ inputs.expansion_rate != '' && inputs.expansion_rate || vars.EXPANSION_RATE || '10' }}
        run: exec node bot.js
