name: Wplace Background Scanner

on:
  workflow_dispatch:
    inputs:
      start_x:
        description: 'Start X coordinate'
        required: true
        type: string
      start_y:
        description: 'Start Y coordinate'
        required: true
        type: string
      end_x:
        description: 'End X coordinate'
        required: true
        type: string
      end_y:
        description: 'End Y coordinate'
        required: true
        type: string
      run_duration_mins:
        description: 'Run duration per cycle (Minutes)'
        required: true
        default: '20'
        type: string
      pause_interval_mins:
        description: 'Pause duration between cycles (Minutes)'
        required: true
        default: '10'
        type: string
      total_cycles:
        description: 'Total cycles to run'
        required: true
        default: '1'
        type: string
      target_interval:
        description: 'Target Interval ms (Default: 500)'
        required: false
        default: '500'
        type: string
      min_floor:
        description: 'Min Floor ms (Default: 399)'
        required: false
        default: '399'
        type: string
      pause_sec_429:
        description: '429 Pause sec (Default: 321)'
        required: false
        default: '321'
        type: string
      penalty_ms_429:
        description: '429 Penalty +ms (Default: 500)'
        required: false
        default: '500'
        type: string
      step_down_ms:
        description: 'Speed Step -ms (Default: 21)'
        required: false
        default: '21'
        type: string
      streak_reqs:
        description: 'Streak for Step (Default: 42)'
        required: false
        default: '42'
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Execute Scanner
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          START_X: ${{ inputs.start_x }}
          START_Y: ${{ inputs.start_y }}
          END_X: ${{ inputs.end_x }}
          END_Y: ${{ inputs.end_y }}
          RUN_DURATION_MINS: ${{ inputs.run_duration_mins }}
          PAUSE_INTERVAL_MINS: ${{ inputs.pause_interval_mins }}
          TOTAL_CYCLES: ${{ inputs.total_cycles }}
          TARGET_INTERVAL: ${{ inputs.target_interval }}
          MIN_FLOOR: ${{ inputs.min_floor }}
          PAUSE_SEC_429: ${{ inputs.pause_sec_429 }}
          PENALTY_MS_429: ${{ inputs.penalty_ms_429 }}
          STEP_DOWN_MS: ${{ inputs.step_down_ms }}
          STREAK_REQS: ${{ inputs.streak_reqs }}
        run: node bot.js